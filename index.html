<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abu Marketplace</title>
    <link rel="icon" type="image/svg+xml" href="/abu-logo.svg" />
    <meta name="description" content="High-density West African digital commerce marketplace in Sierra Leone featuring Leones pricing, verified merchant network, and secure Cash on Delivery fulfillment." />
    <meta property="og:title" content="Abu Marketplace" />
    <meta property="og:description" content="High-density West African digital commerce marketplace in Sierra Leone featuring Leones pricing, verified merchant network, and secure Cash on Delivery fulfillment." />
    <meta property="og:url" content="https://abumarketplace.shop" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://abumarketplace.shop" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abu_marketplace_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F8] text-[#0f1d26] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
