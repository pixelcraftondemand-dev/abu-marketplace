<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <meta name="keywords" content="ABU, abu, Marketplace, ABU Marketplace, abu marketplace, ABU Sierra Leone, abu marketplace sl, Sierra Leone online shopping, online marketplace Sierra Leone, buy in Freetown, Sierra Leone ecommerce, solar Sierra Leone, phone shop Freetown" />

    <!-- OpenGraph Social Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ABU Marketplace" />
    <meta property="og:title" content="ABU Marketplace | Sierra Leone's #1 Online Marketplace (abu)" />
    <meta property="og:description" content="Shop authentic solar power systems, phones, electronics, fashion, and book certified artisans on ABU Marketplace (abu). Safe Cash on Delivery across Sierra Leone." />

    <meta property="og:image" content="https://abumarketplace.shop/abu-logo.svg" />

    <!-- Twitter / X Social Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- High Performance Network Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Schema.org Structured Data (JSON-LD) for #1 Ranking in ABU, abu, Marketplace -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://abumarketplace.shop/#website",
          "url": "https://abumarketplace.shop/",
          "name": "ABU Marketplace",
          "alternateName": ["ABU", "abu", "ABU Marketplace", "abu marketplace", "ABU Online Marketplace"],
          "description": "Sierra Leone's #1 online marketplace for solar power, mobile phones, tech, fashion, and certified blue-collar artisans.",
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://abumarketplace.shop/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://abumarketplace.shop/#organization",
          "name": "ABU Marketplace",
          "alternateName": ["ABU", "abu", "abu marketplace"],
          "url": "https://abumarketplace.shop/",
          "logo": "https://abumarketplace.shop/abu-logo.svg",
          "areaServed": {
            "@type": "Country",
            "name": "Sierra Leone"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+23276892411",
            "contactType": "customer service",
            "areaServed": "SL",
            "availableLanguage": ["en", "Krio"]
          }
        }
      ]
    }
    </script>

    <!-- Instant Theme Mode Bootstrap to Prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('abu_marketplace_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F8] text-[#0f1d26] antialiased">

</html>
