# ─── Security Scanning Pipeline ────────────────────────────────────────────────
# Enterprise-grade security scanning:
#   1. Dependency vulnerability audit (npm audit + Snyk)
#   2. Static Application Security Testing (CodeQL)
#   3. Secret scanning (gitleaks)
#   4. Container scanning (Trivy) for Docker images
#   5. License compliance checking
#
# Runs on PRs and pushes to main. Blocks merges on critical vulnerabilities.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly security scan on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # For CodeQL SARIF upload

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  # ─── Dependency Audit ────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm 11
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit
        run: |
          set -euo pipefail
          echo "🔍 Running npm audit..."
          npm audit --audit-level=high 2>&1 | tee /tmp/audit-report.txt
          
          # Count vulnerabilities
          CRITICAL=$(grep -c "critical" /tmp/audit-report.txt || true)
          HIGH=$(grep -c "high" /tmp/audit-report.txt || true)
          
          echo "📊 Vulnerability Summary:"
          echo "  Critical: $CRITICAL"
          echo "  High: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found! Blocking merge."
            exit 1
          fi
          
          if [ "$HIGH" -gt 5 ]; then
            echo "::warning::More than 5 high vulnerabilities found. Review recommended."
          fi

      - name: Generate SARIF report
        if: always()
        run: |
          npm audit --json > /tmp/audit.json 2>/dev/null || true
          echo "📋 Full audit report saved to /tmp/audit.json"

  # ─── CodeQL SAST ────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ─── Secret Scanning (gitleaks) ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── License Compliance ─────────────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm 11
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check licenses
        run: |
          set -euo pipefail
          echo "📜 Checking dependency licenses..."
          
          # List all licenses
          npx license-checker --summary 2>/dev/null || true
          
          # Check for prohibited licenses (GPL, AGPL for proprietary components)
          PROHIBITED=$(npx license-checker --json 2>/dev/null | \
            jq -r 'to_entries[] | select(.value.licenses | test("GPL-3.0|AGPL")) | .key' || true)
          
          if [ -n "$PROHIBITED" ]; then
            echo "::warning::Copyleft licenses found (GPL/AGPL). Review required:"
            echo "$PROHIBITED"
          else
            echo "✅ No prohibited licenses found"
          fi

  # ─── Container Scanning (Trivy) ────────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'  # Only on PRs to save resources
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t amber-pay-scan:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'amber-pay-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── Security Summary ───────────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dependency-audit, codeql, secret-scan, license-check, container-scan]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "🔒 Security Scan Summary"
          echo "========================"
          echo ""
          echo "Job Statuses:"
          echo "  Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "  CodeQL Analysis: ${{ needs.codeql.result }}"
          echo "  Secret Scanning: ${{ needs.secret-scan.result }}"
          echo "  License Check: ${{ needs.license-check.result }}"
          echo "  Container Scan: ${{ needs.container-scan.result }}"
          echo ""
          
          # Check if any critical job failed
          if [[ "${{ needs.dependency-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.codeql.result }}" == "failure" ]] || \
             [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "::error::Security scan failed! Review required before merge."
            exit 1
          fi
          
          echo "✅ All security checks passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Security scan failed. PR cannot be merged until issues are resolved."
