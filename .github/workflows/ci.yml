name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# WHY npm 11 + these env vars:
# The runner's default npm 10 ignores the `allowScripts` field in
# package.json (an npm >= 11.5 feature). That means puppeteer's postinstall
# downloads Chrome for Testing (~150 MB) and embedded-postgres downloads
# Postgres binaries on EVERY `npm ci` — from cold caches on concurrent
# runners this stalls indefinitely (observed: 40+ min hangs on Tests/Build).
# npm 11 enforces allowScripts, blocking exactly those downloads.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tsc --noEmit
        run: npx tsc --noEmit

  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit & API tests
        run: npm test

  migration-guard:
    name: Migration guard (changed SQL files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs only: guards NEW/changed files under supabase/migrations/ so
    # destructive or unrecognized SQL cannot land on main. Pushes to main were
    # already reviewed in their PR; the deploy pipeline additionally guards the
    # live schema delta before applying it. Legacy migrations that predate the
    # guard (conditional DO $$ blocks) are never checked because only files
    # changed in the PR are examined.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No npm ci needed: lib/migrationGuard.mjs is dependency-free.
      - name: Guard changed migration files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD" -- supabase/migrations/ || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed — nothing to guard."
            exit 0
          fi
          FAILED=0
          for f in $CHANGED; do
            if node lib/migrationGuard.mjs "$f"; then
              echo "  PASS  $f"
            else
              echo "::error::Migration guard rejected $f (destructive or unrecognized SQL)."
              FAILED=1
            fi
          done
          exit "$FAILED"

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run production build
        run: npm run build
