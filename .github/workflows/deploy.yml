name: Deploy

# Runs after CI passes on main, and can be triggered manually.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# npm 11 enforces the allowScripts allowlist in package.json (puppeteer Chrome
# and embedded-postgres binary downloads are blocked), which prevents the
# 40+ min `npm ci` hangs seen on default npm 10. PUPPETEER_SKIP_* is
# belt-and-braces.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Guarded production DB sync: applies ONLY additive schema changes.
  # Destructive or unrecognized SQL fails the deploy loudly. After applying,
  # critical tables are verified to actually exist on prod (e.g. the
  # rate_limit_entry table backing the distributed rate limiter), so a missed
  # migration can never silently degrade to the per-instance in-memory
  # fallback while the smoke battery still passes.
  # ---------------------------------------------------------------------------
  db-sync:
    name: Guarded DB sync (additive-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    services:
      # Local Postgres used as the Prisma shadow database for `migrate diff`.
      shadow:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHADOW_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          npm-version: 11
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate schema delta against production
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_DIRECT_URL:-}" ]; then
            echo "::warning::PROD_DIRECT_URL secret not set — skipping DB sync."
            exit 0
          fi
          npx prisma migrate diff \
            --from-url "$PROD_DIRECT_URL" \
            --shadow-database-url "$SHADOW_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/delta.sql
          echo "Delta generated ($(wc -l < /tmp/delta.sql) lines)."

      - name: Classify delta (additive-only guard)
        run: |
          set -euo pipefail
          if [ ! -s /tmp/delta.sql ]; then
            echo "No schema changes to apply — database already in sync."
            exit 0
          fi
          node lib/migrationGuard.mjs /tmp/delta.sql

      - name: Apply delta to production
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_DIRECT_URL:-}" ] || [ ! -s /tmp/delta.sql ]; then
            echo "Nothing to apply."
            exit 0
          fi
          npx prisma db execute --file /tmp/delta.sql --url "$PROD_DIRECT_URL"
          echo "Additive schema changes applied to production."

      - name: Verify critical tables exist on production
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::PROD_DIRECT_URL not set — skipping table verification."
            exit 0
          fi
          # rate_limit_entry backs the distributed rate limiter; without it the
          # app silently degrades to per-instance in-memory limiting and the
          # smoke 429 check can still pass. Fail the deploy loudly instead.
          node scripts/verify-db-tables.mjs rate_limit_entry

  # ---------------------------------------------------------------------------
  # Post-deploy smoke test: Vercel auto-deploys on push; this waits for the new
  # build to be live (products endpoint recovers) then runs the battery.
  # ---------------------------------------------------------------------------
  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [db-sync]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      BASE_URL: ${{ vars.APP_URL || 'https://www.abumarketplace.shop' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for new build to serve the catalog
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/products" || true)
            if [ "$code" = "200" ]; then
              echo "Catalog live (attempt $i, /api/products -> 200)."
              exit 0
            fi
            echo "attempt $i: /api/products -> $code (waiting for deploy + DB sync)"
            sleep 20
          done
          echo "::error::Timed out waiting for /api/products to return 200 after deploy."
          exit 1

      # prod-smoke.sh includes the rate-limiter hammer check (#11): it hammers
      # /api/exchange from a TEST-NET IP and asserts a 429 with Retry-After,
      # proving the distributed limiter (rate_limit_entry table) enforces on
      # prod — CI catches any future limiter regression. Check #12 then reads
      # the app's per-instance counters (GET /api/health/prisma) and asserts
      # zero UNEXPECTED prisma:error events were emitted during the hammer,
      # catching the P2002 log-noise regression if it ever returns.
      - name: Run smoke battery
        run: bash scripts/prod-smoke.sh
