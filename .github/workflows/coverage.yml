# ─── Code Coverage Tracking ────────────────────────────────────────────────────
# Tracks test coverage and posts results as PR comments.
# Enforces minimum coverage thresholds for new code.
# Uploads coverage reports to Codecov for historical tracking.

name: Code Coverage

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm 11
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          npx vitest run --coverage --reporter=json --outputFile=coverage/coverage-summary.json 2>/dev/null || \
          npx vitest run --coverage

      - name: Generate coverage report
        if: always()
        run: |
          set -euo pipefail
          
          # Check if coverage report exists
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "📊 Coverage Summary:"
            cat coverage/coverage-summary.json | jq '.total'
            
            # Extract percentages
            STATEMENTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')
            FUNCTIONS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')
            LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            
            echo ""
            echo "📈 Coverage Metrics:"
            echo "  Statements: ${STATEMENTS}%"
            echo "  Branches: ${BRANCHES}%"
            echo "  Functions: ${FUNCTIONS}%"
            echo "  Lines: ${LINES}%"
            
            # Enforce minimum thresholds
            MIN_THRESHOLD=70
            if (( $(echo "$STATEMENTS < $MIN_THRESHOLD" | bc -l) )); then
              echo "::warning::Statement coverage (${STATEMENTS}%) is below ${MIN_THRESHOLD}%"
            fi
          else
            echo "⚠️  Coverage report not found. Running basic coverage check..."
            npx vitest run --coverage 2>&1 | tail -20
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-summary.json
          flags: unittests
          name: amber-pay-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read coverage report
            let coverageData;
            try {
              const reportPath = path.join(process.cwd(), 'coverage/coverage-summary.json');
              coverageData = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (e) {
              console.log('Coverage report not found, skipping comment');
              return;
            }
            
            const total = coverageData.total;
            const statementPct = total.statements.pct;
            const branchPct = total.branches.pct;
            const functionPct = total.functions.pct;
            const linePct = total.lines.pct;
            
            // Create coverage badge
            const getBadge = (pct) => {
              if (pct >= 90) return '🟢';
              if (pct >= 70) return '🟡';
              return '🔴';
            };
            
            const body = `## 📊 Code Coverage Report
            
            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Statements | ${statementPct}% | ${getBadge(statementPct)} |
            | Branches | ${branchPct}% | ${getBadge(branchPct)} |
            | Functions | ${functionPct}% | ${getBadge(functionPct)} |
            | Lines | ${linePct}% | ${getBadge(linePct)} |
            
            **Minimum threshold:** 70%
            
            <details>
            <summary>📈 Detailed Coverage</summary>
            
            \`\`\`json
            ${JSON.stringify(total, null, 2)}
            \`\`\`
            
            </details>
            
            ---
            *Generated by Code Coverage Workflow*`;
            
            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const coverageComment = comments.find(c => 
              c.body.includes('Code Coverage Report')
            );
            
            if (coverageComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: coverageComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
