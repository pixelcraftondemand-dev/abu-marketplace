# ─── Release Management ────────────────────────────────────────────────────────
# Automated release pipeline with:
#   - Semantic versioning (semver)
#   - Changelog generation
#   - GitHub releases with artifacts
#   - Docker image tagging
#   - Deployment to staging/production
#   - Rollback procedures

name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.1.3, etc.)
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  # ─── Version Bump ────────────────────────────────────────────────────────────
  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Bump version
          BUMP_TYPE="${{ github.event.inputs.release_type }}"
          npm version "$BUMP_TYPE" --no-git-tag-version
          
          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          
          # Create tag
          TAG="v${NEW_VERSION}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          # Commit and tag
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "$TAG"
          git push origin main "$TAG"

  # ─── Build & Test ────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version-bump]
    if: always() && (needs.version-bump.result == 'success' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm 11
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            .next
            package.json
            package-lock.json
            prisma
          retention-days: 7

  # ─── Docker Build & Push ────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=20

  # ─── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, docker]
    environment: staging
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Tag: ${{ needs.docker.outputs.tag || github.ref_name }}"
          # Add your deployment commands here
          # Examples:
          # - vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          # - kubectl apply -f k8s/staging/
          # - aws ecs update-service ...

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          # Add smoke test commands here
          # bash scripts/smoke-test.sh https://staging.example.com

  # ─── Deploy to Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, docker, deploy-staging]
    environment: production
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Tag: ${{ needs.docker.outputs.tag || github.ref_name }}"
          # Add your deployment commands here

      - name: Verify deployment
        run: |
          echo "✅ Verifying production deployment..."
          # Add verification commands here

  # ─── GitHub Release ─────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-bump, docker, deploy-production]
    if: always() && needs.version-bump.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            # Generate changelog from commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD 2>/dev/null || echo "")
          else
            # First release
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD 2>/dev/null | head -20 || echo "")
          fi
          
          # Save to file
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "📝 Changelog generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-bump.outputs.tag || github.ref_name }}
          name: "Release ${{ needs.version-bump.outputs.tag || github.ref_name }}"
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: ${{ contains(needs.version-bump.outputs.version || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Rollback ────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "⚠️  Deployment failed. Initiating rollback..."
          # Add rollback commands here
          # Examples:
          # - kubectl rollout undo deployment/app
          # - vercel rollback --token=${{ secrets.VERCEL_TOKEN }}
          echo "Rollback completed. Please investigate the failure."

      - name: Notify team
        if: always()
        run: |
          echo "🔔 Notifying team of rollback..."
          # Add notification commands here
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"⚠️ Production deployment rolled back! Please investigate."}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
