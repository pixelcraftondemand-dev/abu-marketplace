name: Deploy Kubernetes

# Optional containerized deployment (see k8s/README.md).
#
# DISABLED BY DEFAULT. To enable:
#   1. Set the repository variable ENABLE_K8S_DEPLOY = true (Settings -> Secrets
#      and variables -> Actions -> Variables).
#   2. Add the KUBE_CONFIG secret containing a base64 kubeconfig for the cluster.
#   3. Set the IMAGE_REGISTRY repository variable if not using GHCR (default:
#      ghcr.io/<owner>/<repo>).
# The workflow builds the Docker image, pushes it, patches k8s/deployment.yaml
# with the new image tag, and rolls it out.

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: k8s-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build image and roll out
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        run: |
          REG="${IMAGE_REGISTRY:-ghcr.io/${{ github.repository }}}"
          echo "registry=${REG}" >> "$GITHUB_OUTPUT"
          echo "tag=${REG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "::error::KUBE_CONFIG secret not set — cannot deploy to Kubernetes."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Patch image reference in manifest
        run: |
          sed -i "s|image: abu-marketplace:latest|image: ${{ steps.image.outputs.tag }}|" k8s/deployment.yaml
          grep -n "image:" k8s/deployment.yaml

      - name: Apply manifests and wait for rollout
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/abu-marketplace --timeout=300s
          kubectl get pods -l app=abu-marketplace

      - name: Verify readiness probe
        run: |
          kubectl wait --for=condition=ready pod -l app=abu-marketplace --timeout=120s
          echo "Kubernetes deployment verified."
