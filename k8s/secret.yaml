apiVersion: v1
kind: Secret
metadata:
  name: abu-marketplace-secrets
type: Opaque
stringData:
  DATABASE_PROVIDER: "postgresql"
  DATABASE_URL: "postgresql://postgres:password@abu-marketplace-postgres:5432/postgres"
  NEXT_PUBLIC_APP_URL: "https://abu-marketplace.example.com"
  ADMIN_EMAIL: "admin@example.com"
  # AMBER PAY is in-house — no external payment provider keys needed.
  # Platform fee rates are configured via env vars:
  AMBER_PAY_FEE_RATE: "0.02"
  AMBER_PAY_AGENT_COMMISSION: "0.02"
  AMBER_PAY_MERCHANT_FEE: "0.05"
  IMAGEKIT_PUBLIC_KEY: "public_example"
  IMAGEKIT_PRIVATE_KEY: "private_example"
  IMAGEKIT_URL_ENDPOINT: "https://ik.imagekit.io/example"
  OPENAI_API_KEY: "openai_example"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL: "gpt-4o-mini"
  INNGEST_EVENT_KEY: "inngest_event_key_example"
  INNGEST_SIGNING_KEY: "inngest_signing_key_example"
  RESEND_API_KEY: "resend_example"
